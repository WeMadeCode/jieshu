packages:
  - 'packages/*'
  - 'examples/*'
  - 'docs'

# pnpm 10.26+ lifecycle allowlist. Only esbuild needs its postinstall step to
# locate and validate the platform binary; the other scripts are nonessential
# banners, telemetry, or optional native acceleration.
allowBuilds:
  '@angular/cli': false
  ant-design-vue: false
  core-js: false
  core-js-pure: false
  ejs: false
  es5-ext: false
  esbuild: true
  fsevents: false
  nice-napi: false
  vue-demi: false
